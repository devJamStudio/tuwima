<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Kropki - Hover Areas Only</title>
    <style>
        :root {
            --success-color: #00a906;  /* Green - Lokal Dostępny */
            --warning-color: #ff7a04;  /* Orange - Lokal Zarezerwowany */
            --danger-color: #ff0000;   /* Red - Lokal Sprzedany */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .map-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
            width: 100%;
            max-width: 1564px;
        }

        .background-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .overlay-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dot {
            cursor: pointer;
            transition: transform 0.2s ease;
            transform-origin: center;
            pointer-events: auto;
        }


        .area {
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
            shape-rendering: geometricPrecision;
            pointer-events: none;
        }

        .area.show {
            opacity: 0.45;
            pointer-events: auto;
        }

        .area:hover {
            opacity: 0.45;
            pointer-events: auto;
        }

    </style>
</head>
<body>
    <div class="map-container">
        <img id="backgroundImage" class="background-image" src="kropki.jpg" alt="Kropki Background">
        <svg id="overlaySvg" class="overlay-svg" viewBox="0 0 1564 718">
            <!-- SVG overlay content will be generated by JavaScript -->
        </svg>
    </div>

    <script>
        // Kropki mapping data (from kropki.jpg analysis)
        const kropkiMapping = {
            dimensions: { width: 1564, height: 718 },
            greenAreas: [
                { x: 1288, y: 334, size: 341.5, rgb: [0, 169, 6], id: "GREEN_AREA_01" },
                { x: 267, y: 322, size: 350, rgb: [0, 170, 4], id: "GREEN_AREA_02" },
                { x: 953, y: 516, size: 347, rgb: [2, 169, 4], id: "GREEN_AREA_03" }
            ],
            orangeAreas: [
                { x: 264, y: 516, size: 349, rgb: [253, 122, 4], id: "ORANGE_AREA_01" },
                { x: 953, y: 322, size: 336, rgb: [253, 122, 4], id: "ORANGE_AREA_02" }
            ],
            redAreas: [
                { x: 1288, y: 528, size: 358.5, rgb: [253, 2, 0], id: "RED_AREA_01" }
            ]
        };

        // Manually marked areas data (from exported JSON) - using lokale data for kropki
        const markedAreasData = [
            {

                ]
            },
            {

                "type": "orange",
                "dot": { "x": 953, "y": 322, "rgb": [255, 122, 4] },
                "points": [
                    { "x": 766.8523002421307, "y": 280.2320584894475 },
                    { "x": 770.639225181598, "y": 278.3385986347891 },
                    { "x": 768.7457627118644, "y": 443.0696059900725 },
                    { "x": 1030.043583535109, "y": 446.85652569938935 },
                    { "x": 1030.043583535109, "y": 588.8660147987715 },

                    { "x": 79.52542372881356, "y": 265.08437965218013 },
                    { "x": 85.20581113801452, "y": 278.3385986347891 },
                    { "x": 98.46004842615012, "y": 282.12551834410596 },
                    { "x": 98.46004842615012, "y": 444.9630658447309 },

            },
            {

                "type": "green", 
                "dot": { "x": 953, "y": 516, "rgb": [0, 169, 6] },
                "points": [
                    { "x": 766.8523002421307, "y": 444.9630658447309 },
                    { "x": 770.639225181598, "y": 588.8660147987715 },

                ]
            },
            {
                "id": "RED_AREA_01",
                "type": "red",
                "dot": { "x": 1288, "y": 528, "rgb": [254, 0, 3] },
                "points": [
                    { "x": 1206.135593220339, "y": 448.7499855540478 },
                    { "x": 1206.135593220339, "y": 590.75947465343 },
                    { "x": 1469.3268765133173, "y": 588.8660147987715 },

                ]
            }
        ];

        function updateMap() {
            const svg = document.getElementById('overlaySvg');
            
            // Clear previous overlay content
            svg.innerHTML = '';
            
            // Set viewBox
            svg.setAttribute('viewBox', `0 0 ${kropkiMapping.dimensions.width} ${kropkiMapping.dimensions.height}`);
            
            // Add areas and dots using marked areas data
            addAreasAndDots(svg);
        }
        
        function addAreasAndDots(svg) {
            markedAreasData.forEach((markedArea, index) => {
                // Create polygon area (hidden by default)
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const points = markedArea.points.map(p => `${p.x},${p.y}`).join(' ');
                polygon.setAttribute('points', points);
                polygon.setAttribute('fill', getAreaColor(markedArea.type));
                polygon.setAttribute('opacity', '0');
                polygon.setAttribute('stroke', getAreaColor(markedArea.type));
                polygon.setAttribute('stroke-width', '2');
                polygon.setAttribute('class', 'area');
                polygon.setAttribute('data-type', `${markedArea.type}-area`);
                polygon.setAttribute('data-index', index);
                polygon.addEventListener('mouseenter', (e) => {
                    e.stopPropagation();
                });
                polygon.addEventListener('mouseleave', (e) => {
                    e.stopPropagation();
                });
                svg.appendChild(polygon);
                
                // Create dot (visible)
                const dotCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dotCircle.setAttribute('cx', markedArea.dot.x);
                dotCircle.setAttribute('cy', markedArea.dot.y);
                dotCircle.setAttribute('r', 8);
                dotCircle.setAttribute('fill', `rgb(${markedArea.dot.rgb.join(',')})`);
                dotCircle.setAttribute('stroke', 'white');
                dotCircle.setAttribute('stroke-width', 2);
                dotCircle.setAttribute('class', 'dot');
                dotCircle.setAttribute('data-type', `${markedArea.type}-dot`);
                dotCircle.setAttribute('data-index', index);
                dotCircle.addEventListener('mouseenter', (e) => {
                    e.stopPropagation();
                    polygon.classList.add('show');
                });
                dotCircle.addEventListener('mouseleave', (e) => {
                    e.stopPropagation();
                    polygon.classList.remove('show');
                });
                svg.appendChild(dotCircle);
            });
        }
        
        function getAreaColor(type) {
            const colors = {
                green: 'var(--success-color)',
                orange: 'var(--warning-color)',
                red: 'var(--danger-color)'
            };
            return colors[type] || 'var(--success-color)';
        }
        
        function hideAllAreas() {
            const areas = document.querySelectorAll('.area');
            areas.forEach(area => {
                area.classList.remove('show');
            });
        }
        
        // Initialize event listeners
        document.addEventListener('DOMContentLoaded', () => {
            const svg = document.getElementById('overlaySvg');
            svg.addEventListener('mouseleave', hideAllAreas);
        });
        
        // Initialize
        updateMap();
    </script>
</body>
</html>
